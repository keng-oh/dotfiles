################
### MONITORS ###
################

$mon_laptop = Sharp Corporation 0x15C3
$mon_side   = Stargate Technology IPS28UHDRC65W demoset-1
$mon_top    = IPS Inc. (Intellectual Property Solutions Inc.) 28I144UR-C65W

monitor = desc:$mon_laptop, 1920x1200@120, 0x1000, 1.2
monitor = desc:$mon_top,    3840x2160@60,  1600x560,     1.5
monitor = desc:$mon_side,   3840x2160@60,  4160x0,   1.5, transform, 3
monitor = ,preferred,auto,1

##########################
### CATPPUCCIN MOCHA   ###
##########################

$rosewater = 0xfff5e0dc
$flamingo  = 0xfff2cdcd
$pink      = 0xfff5c2e7
$mauve     = 0xffcba6f7
$red       = 0xfff38ba8
$maroon    = 0xffeba0ac
$peach     = 0xfffab387
$yellow    = 0xfff9e2af
$green     = 0xffa6e3a1
$teal      = 0xff94e2d5
$sky       = 0xff89dceb
$sapphire  = 0xff74c7ec
$blue      = 0xff89b4fa
$lavender  = 0xffb4befe
$text      = 0xffcdd6f4
$overlay2  = 0xff9399b2
$surface2  = 0xff585b70
$surface1  = 0xff45475a
$surface0  = 0xff313244
$base      = 0xff1e1e2e
$mantle    = 0xff181825
$crust     = 0xff11111b

####################
### ENVIRONMENT  ###
####################

env = GNOME_KEYRING_CONTROL,$XDG_RUNTIME_DIR/keyring
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh

####################
### AUTOSTART    ###
####################

exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = ~/repos/dotfiles/hypr/scripts/set-wallpapers.sh
exec-once = fcitx5 -d
exec-once = hypridle
exec-once = ~/.nix-profile/libexec/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = 1password --silent

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = PATH,$HOME/.nix-profile/bin:/usr/local/bin:/usr/bin:/bin
env = XDG_DATA_DIRS,$HOME/.nix-profile/share:/usr/local/share:/usr/share
env = LANG,ja_JP.UTF-8
env = LC_ALL,ja_JP.UTF-8
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GTK_THEME,adw-gtk3-dark
env = COLOR_SCHEME,prefer-dark
env = QT_QPA_PLATFORM,wayland
# nixpkgsのElectronラッパー(Discord等)をネイティブWaylandで起動させる
env = NIXOS_OZONE_WL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 6
    border_size = 2
    col.active_border = $mauve $blue 45deg
    col.inactive_border = $surface1
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2ecc)
        color_inactive = rgba(1e1e2e88)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = easeOut,     0.16, 1,    0.3,  1
    bezier = easeInOut,   0.87, 0,    0.13, 1
    bezier = overshot,    0.05, 0.9,  0.1,  1.05
    bezier = linear,      0.0,  0.0,  1.0,  1.0

    animation = windows,        1, 4,  overshot
    animation = windowsIn,      1, 4,  easeOut,   slide
    animation = windowsOut,     1, 3,  easeInOut, popin 80%
    animation = windowsMove,    1, 3,  easeOut
    animation = border,         1, 6,  linear
    animation = borderangle,    1, 60, linear, loop
    animation = fade,           1, 4,  easeOut
    animation = workspaces,       1, 4,  easeOut, slide
    animation = specialWorkspace, 1, 4,  easeOut, slide
}

dwindle {
    preserve_split = true
    smart_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

# XWaylandアプリ(Spotify等)がフラクショナルスケーリングでガビガビになるのを防ぐ
xwayland {
    force_zero_scaling = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_options = altwin:swap_alt_win,ctrl:nocaps
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        scroll_factor = 0.8
    }
}


####################
### KEYBINDINGS  ###
####################

$mod = SUPER
$terminal = wezterm
$launcher = wofi --show drun
$browser = google-chrome-stable
$filemanager = nautilus

# アプリ起動
bind = $mod, Return, exec, $terminal
bind = $mod, R, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $filemanager
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, togglefloating
bind = $mod, P, pseudo                   # dwindle
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# クリップボード履歴
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && sleep 0.3 && wl-paste | wtype -

# スクリーンロック（CTRL+L に変更：$mod+l はフォーカス移動と競合するため）
bind = $mod CTRL, L, exec, hyprlock

# フォーカス移動（vim キー）
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# ウィンドウ移動
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# ウィンドウをワークスペースへサイレント移動
bind = $mod CTRL, h, movetoworkspace, -1
bind = $mod CTRL, l, movetoworkspace, +1

# ウィンドウリサイズ（リピート可）
binde = $mod ALT, h, resizeactive, -30 0
binde = $mod ALT, l, resizeactive,  30 0
binde = $mod ALT, k, resizeactive,  0 -30
binde = $mod ALT, j, resizeactive,  0  30

# ワークスペース切替
bind = $mod, Tab, workspace, previous
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ウィンドウをワークスペースへ移動
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# スクロールでワークスペース移動
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# マウスでウィンドウ操作
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# スクリーンショット
bind = , Print,            exec, grimblast copysave area    ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mod, Print,        exec, grimblast copysave active  ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mod SHIFT, Print,  exec, grimblast copysave screen  ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# 音量
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bind   = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind   = , XF86AudioPlay,        exec, playerctl play-pause
bind   = , XF86AudioNext,        exec, playerctl next
bind   = , XF86AudioPrev,        exec, playerctl previous

# 輝度
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

#######################
### WINDOW RULES    ###
#######################

# フローティング固定サイズ
windowrule = float class:^(nm-connection-editor)$
windowrule = float class:^(blueman-manager)$
windowrule = float class:^(pavucontrol)$
windowrule = float title:^(Picture-in-Picture)$
windowrule = pin   title:^(Picture-in-Picture)$

# ダイアログ系
windowrule = float  class:^(xdg-desktop-portal-gtk)$
windowrule = center class:^(xdg-desktop-portal-gtk)$
